<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Filament on Hand</title>
  <meta name="description" content="Filament colors available to print with. Pick one and let me know.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Filament on hand</h1>
    <p class="lede">Pick a color for your print and tell me which one. Swatches are approximate.</p>
  </header>

  <section class="toolbar" aria-label="Filter and sort">
    <div class="field grow">
      <label for="q">Search</label>
      <input id="q" type="search" placeholder="Color, name, vendor…" autocomplete="off">
    </div>
    <div class="field">
      <label for="vendor">Vendor</label>
      <select id="vendor"><option value="">All vendors</option></select>
    </div>
    <div class="field">
      <label for="sort">Sort by</label>
      <select id="sort">
        <option value="color">Color</option>
        <option value="name">Name</option>
        <option value="material">Material</option>
        <option value="vendor">Vendor</option>
        <option value="remaining">Amount left</option>
      </select>
    </div>
    <div class="field">
      <label for="dir">Order</label>
      <select id="dir">
        <option value="asc">Ascending</option>
        <option value="desc">Descending</option>
      </select>
    </div>
    <fieldset class="materials">
      <legend>Material</legend>
      <div id="materials" class="chips"></div>
    </fieldset>
    <div class="status-row">
      <span id="count" aria-live="polite"></span>
      <button id="share" type="button">Copy link to this view</button>
    </div>
  </section>

  <main id="grid" class="grid" aria-busy="true"></main>
  <p id="empty" class="empty" hidden>No filament matches these filters.</p>

  <footer><span id="updated"></span></footer>
  <script src="/app.js" type="module"></script>
</body>
</html>
